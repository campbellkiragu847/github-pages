<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From enoch to lilly</title>
    <style>
        body {
            background-color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .envelope {
            width: 200px;
            height: 150px;
            background-color: pink;
            margin: 100px auto;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        .envelope:after {
            content: "Tap to Open";
            position: absolute;
            top: -30px;
            font-size: 16px;
            font-weight: bold;
        }

        .card {
            display: none;
            margin: 20px auto;
            padding: 20px;
            background-color: lightpink;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .yes-btn {
            background-color: green;
            color: white;
        }

        .no-btn {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>

    <h1>From enoch to lilly</h1>

    <div class="envelope" onclick="openCard()"></div>

    <div class="card" id="card">
        <h2>Will you be my Valentine?</h2>
        <div class="buttons" id="buttons">
            <button class="btn yes-btn" onclick="accept()">Yes</button>
            <button class="btn no-btn" onclick="addYes()">No</button>
        </div>
    </div>

    <script>
        function openCard() {
            document.getElementById("card").style.display = "block";
        }

        function accept() {
            alert("Yay! ❤️!");
        }

        function addYes() {
            let buttonsDiv = document.getElementById("buttons");
            let yesButton = document.createElement("button");
            yesButton.innerText = "Yes";
            yesButton.className = "btn yes-btn";
            yesButton.onclick = accept;
            buttonsDiv.appendChild(yesButton);

            let noButton = document.querySelector(".no-btn");
            if (noButton) {
                noButton.remove(); // Remove "No" button once a "Yes" is added
            }
        }
    </script>

</body>
</html>
